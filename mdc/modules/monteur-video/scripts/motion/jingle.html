<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Jingle — Avec Mon Fiscaliste</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#04060C}
body{position:relative;font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.script{font-family:"Snell Roundhand",cursive;font-weight:700}
.goldg{background:linear-gradient(180deg,#FFF1C9 0%,#FFD98A 30%,#E8B64A 60%,#B8862A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head>
<body><div id="root" class="abs" style="inset:0"></div>
<svg width="0" height="0" style="position:absolute"><defs>
 <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8C6A14"/><stop offset=".32" stop-color="#F3D77E"/><stop offset=".52" stop-color="#C69B2E"/><stop offset=".78" stop-color="#F6DE8E"/><stop offset="1" stop-color="#9A7518"/></linearGradient>
 <linearGradient id="gGoldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7E4A0"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#9A7518"/></linearGradient>
</defs></svg>
<script>
// Jingle d'ouverture de la chaîne (7,5 s), synchronisé sur jingle.wav :
// 0,0–0,6 traînée de lumière · 0,62 impact (anneau) · 0,95 sceau · 1,2–2,4 nom manuscrit · 1,0 portrait
// 2,4 « CÔTE D'IVOIRE » · 3,3 « SOYEZ EN RÈGLE » · 4,15 « Une chaîne de La Maison de la Conformité » · 6,9–7,5 fondu
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), P=(t,a,d)=>cl((t-a)/d);
const oQ=x=>1-Math.pow(1-x,5), oC=x=>1-Math.pow(1-x,3), iO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const oB=(x,s=1.6)=>{if(x<=0)return 0;if(x>=1)return 1;x-=1;return x*x*((s+1)*x+s)+1};
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const S=(e,o)=>{for(const k in o)e.style[k]=o[k]};
let W,H,V,E={};
function seal(size){let p='';for(let i=0;i<20;i++){const a=i/20*Math.PI*2;p+=`<circle cx="${Math.cos(a)*78}" cy="${Math.sin(a)*78}" r="16" fill="url(#gGold)"/>`}
  return `<svg width="${size}" height="${size}" viewBox="-100 -100 200 200"><g class="pet">${p}</g><circle r="82" fill="url(#gGold)"/><circle r="72" fill="#1B274A"/>
  <circle r="72" fill="none" stroke="url(#gGold)" stroke-width="3"/><circle r="63" fill="none" stroke="#D4AF37" stroke-opacity=".7" stroke-width="1.2"/>
  <text x="0" y="22" text-anchor="middle" font-family="Didot, Bodoni 72, serif" font-weight="700" font-size="64" fill="url(#gGoldV)" letter-spacing="-4">MF</text></svg>`}
function init(cfg){
  W=cfg.W;H=cfg.H;V=H>W;document.body.style.width=W+'px';document.body.style.height=H+'px';
  const r=document.getElementById('root');
  r.appendChild($(`<div class="abs" style="inset:0;background:radial-gradient(${V?'120% 70% at 50% 30%':'90% 110% at 35% 45%'},#1F2F60 0%,#101A3A 50%,#05080F 100%)"></div>`));
  E.grid=$(`<div class="abs" style="inset:0;background-image:linear-gradient(rgba(140,170,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(140,170,255,.06) 1px,transparent 1px);background-size:${V?60:72}px ${V?60:72}px;-webkit-mask-image:radial-gradient(70% 70% at 50% 45%,#000 20%,transparent 85%)"></div>`);r.appendChild(E.grid);
  E.dots=[...Array(46)].map((_,i)=>{const s=4+R(i)*14;const d=$(`<div class="abs" style="width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(circle,rgba(255,225,150,.9),rgba(232,182,74,0) 70%)"></div>`);r.appendChild(d);return {d,x:R(i+3)*W,y:R(i+7)*H,v:10+R(i+9)*30,ph:R(i+11)*6}});
  // portrait
  const ph=V?H*.52:H*.94, px=V?W*.5:W*.79;
  E.halo=$(`<div class="abs" style="left:${px-ph*.55}px;top:${H-ph*1.02}px;width:${ph*1.1}px;height:${ph*1.1}px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,100,.35) 0%,rgba(232,182,74,.12) 40%,transparent 68%)"></div>`);r.appendChild(E.halo);
  E.pic=$(`<img class="abs" src="${cfg.photo}" style="height:${ph}px;left:${px}px;bottom:0;transform-origin:50% 100%;filter:drop-shadow(0 0 30px rgba(0,0,0,.6))">`);r.appendChild(E.pic);
  E.picShade=$(`<div class="abs" style="left:0;right:0;bottom:0;height:${V?H*.12:H*.18}px;background:linear-gradient(0deg,#05080F,transparent)"></div>`);r.appendChild(E.picShade);
  // bloc marque
  const cx=V?W*.5:W*.30, ss=V?220:230;
  const y0=V?H*.075:H*.13;
  E.seal=$(`<div class="abs" style="left:${cx-ss/2}px;top:${y0}px;width:${ss}px;height:${ss}px">${seal(ss)}</div>`);r.appendChild(E.seal);
  E.glint=$(`<div class="abs" style="left:${cx-ss*.9}px;top:${y0-ss*.4}px;width:${ss*1.8}px;height:${ss*1.8}px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,230,.95) 0%,rgba(255,220,140,.35) 18%,transparent 45%)"></div>`);r.appendChild(E.glint);
  const fsN=V?104:106, yN=y0+ss+(V?20:26);
  E.name=$(`<div class="abs script" style="left:${cx-W*.5}px;width:${W}px;top:${yN}px;text-align:center;font-size:${fsN}px;line-height:1.1;color:#FBF7EC;white-space:nowrap;text-shadow:0 4px 24px rgba(0,0,0,.45)">Avec Mon Fiscaliste</div>`);r.appendChild(E.name);
  const yC=yN+fsN*1.25;
  E.cote=$(`<div class="abs" style="left:${cx-W*.5}px;width:${W}px;top:${yC}px;display:flex;justify-content:center;align-items:center;gap:22px">
     <span class="l" style="height:2px;background:#D4AF37;display:block;width:0"></span><span class="t" style="font-weight:600;font-size:${V?28:32}px;color:#EDE6D2;white-space:nowrap">CÔTE D'IVOIRE</span><span class="l" style="height:2px;background:#D4AF37;display:block;width:0"></span></div>`);r.appendChild(E.cote);
  const yS=yC+(V?78:96);
  E.soyez=$(`<div class="abs" style="left:${cx-W*.5}px;width:${W}px;top:${yS}px;display:flex;justify-content:center;align-items:center;gap:26px">
     <span class="l" style="height:3px;background:linear-gradient(90deg,transparent,#E8B64A);display:block;width:0"></span>
     <span class="t" style="font-weight:800;font-size:${V?54:62}px;letter-spacing:.24em;white-space:nowrap;background:linear-gradient(100deg,#B8862A 0%,#FFD98A 35%,#FFFFFF 50%,#FFD98A 65%,#B8862A 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent">SOYEZ EN RÈGLE</span>
     <span class="l" style="height:3px;background:linear-gradient(90deg,#E8B64A,transparent);display:block;width:0"></span></div>`);r.appendChild(E.soyez);
  // traînée, anneau, flash, fondu
  E.streak=$(`<div class="abs" style="left:0;top:${V?H*.3:H*.45}px;width:${W*.5}px;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,#FFE7A8 70%,#fff);box-shadow:0 0 30px 10px rgba(255,210,120,.55)"></div>`);r.appendChild(E.streak);
  E.ring=$(`<div class="abs" style="left:${cx-300}px;top:${y0+ss/2-300}px;width:600px;height:600px;border-radius:50%;border:6px solid rgba(255,220,140,.9);box-shadow:0 0 60px rgba(255,200,100,.7),inset 0 0 60px rgba(255,200,100,.4)"></div>`);r.appendChild(E.ring);
  E.flash=$(`<div class="abs" style="inset:0;background:radial-gradient(circle at ${cx}px ${y0+ss/2}px,rgba(255,245,220,.95),rgba(255,210,140,.35) 30%,transparent 65%)"></div>`);r.appendChild(E.flash);
  // signature entreprise : La Maison de la Conformité
  const lw=V?W*.8:W*.42, ly=V?H*.12:H*.3;
  E.mdc=$(`<div class="abs" style="left:${cx-lw/2}px;top:${ly}px;width:${lw}px;text-align:center">
     <div class="k" style="font-weight:700;font-size:${V?30:30}px;letter-spacing:.42em;color:#FFD98A;margin-bottom:22px">UNE CHAÎNE DE</div>
     <div class="c" style="position:relative;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 3px rgba(255,217,138,.6)">
       <img src="${cfg.logo}" style="display:block;width:100%"><div class="sh abs" style="inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:300% 100%"></div></div>
     <div class="s" style="margin-top:26px;font-weight:600;font-size:${V?34:32}px;letter-spacing:.12em;color:#EDE6D2">COMPTABLE · FISCAL · SOCIAL</div>
     <div class="a" style="margin-top:10px;font-size:${V?26:24}px;letter-spacing:.2em;color:rgba(237,230,210,.7)">PRÉPARER · ASSISTER · DÉFENDRE</div></div>`);r.appendChild(E.mdc);
  E.noir=$(`<div class="abs" style="inset:0;background:#000"></div>`);r.appendChild(E.noir);
  return Promise.all([document.fonts.ready,new Promise(ok=>{if(E.pic.complete)ok();else E.pic.onload=E.pic.onerror=ok})]).then(()=>{E.pic.style.left=(px-E.pic.offsetWidth/2)+'px';return true});
}
function renderAt(T){
  // fond et particules
  E.grid.style.opacity=.4+.6*oC(P(T,.6,1.2));
  E.dots.forEach((p,i)=>{const y=(p.y-T*p.v+H*2)%H, o=(.25+.5*Math.sin(T*1.3+p.ph)**2)*oC(P(T,.5,1));S(p.d,{left:p.x+Math.sin(T*.6+p.ph)*20+'px',top:y+'px',opacity:o})});
  // traînée lumineuse
  const s=P(T,.05,.55);S(E.streak,{opacity:s>0&&s<1?1:0,transform:`translateX(${-W*.5+s*W*1.5}px)`});
  // impact
  const f=P(T,.6,.5);S(E.flash,{opacity:T<.6?0:Math.exp(-(T-.6)*6)});
  const rg=P(T,.62,1.1);S(E.ring,{opacity:rg>0?(1-rg)*.9:0,transform:`scale(${.2+1.6*oQ(rg)})`});
  // sceau
  const se=oB(P(T,.85,.6),1.4);S(E.seal,{opacity:cl(P(T,.85,.2)),transform:`scale(${.3+.7*se}) rotate(${(1-se)*-120}deg)`});
  const gl=Math.max(Math.exp(-Math.pow((T-1.0)/.12,2)),Math.exp(-Math.pow((T-3.6)/.15,2))*.5);S(E.glint,{opacity:gl,transform:`scale(${.6+.4*gl})`});
  // nom manuscrit : révélation de gauche à droite
  const n=iO(P(T,1.15,1.25));S(E.name,{opacity:n>0?1:0,clipPath:`inset(-20% ${(1-n)*100}% -20% 0)`,filter:n<1?`blur(${(1-n)*2}px)`:'none'});
  // portrait
  const pe=oQ(P(T,1.0,1.0));S(E.pic,{opacity:pe,transform:`translateY(${(1-pe)*80}px) scale(${1.04-.04*pe+.012*T})`});E.halo.style.opacity=pe*(.8+.2*Math.sin(T*2));
  // Côte d'Ivoire
  const c=oQ(P(T,2.3,.6));E.cote.querySelectorAll('.l').forEach(l=>l.style.width=(V?90:120)*c+'px');
  const ct=E.cote.querySelector('.t');S(ct,{opacity:oC(P(T,2.45,.6)),letterSpacing:(.9-.55*oC(P(T,2.45,.8)))+'em'});
  // Soyez en règle + éclat
  const so=oQ(P(T,3.0,.45));const st=E.soyez.querySelector('.t');
  S(st,{opacity:so,filter:so<1?`blur(${(1-so)*10}px)`:'none',transform:`translateY(${(1-so)*16}px)`,backgroundPosition:`${100-100*iO(P(T,3.25,.8))}% 0`});
  E.soyez.querySelectorAll('.l').forEach(l=>l.style.width=(V?70:110)*oC(P(T,3.1,.5))+'px');
  // bascule : la marque s'efface, La Maison de la Conformité apparaît (4,0 s)
  const out=iO(P(T,3.9,.45));[E.seal,E.name,E.cote,E.soyez,E.glint].forEach(e=>{e.style.opacity=(parseFloat(e.style.opacity||1))*(1-out);e.style.translate=`0 ${-40*out}px`});
  const mi=oB(P(T,4.15,.55),1.3);S(E.mdc,{opacity:cl(P(T,4.15,.25)),transform:`translateY(${(1-mi)*60}px) scale(${.9+.1*mi})`});
  E.mdc.querySelector('.k').style.opacity=oC(P(T,4.05,.4));E.mdc.querySelector('.s').style.opacity=oC(P(T,4.75,.45));E.mdc.querySelector('.a').style.opacity=oC(P(T,5.05,.45));
  E.mdc.querySelector('.sh').style.backgroundPosition=`${100-100*iO(P(T,4.5,.9))}% 0`;
  // fondu au noir
  E.noir.style.opacity=T<.02?1-P(T,0,.02):oC(P(T,6.9,.6));
  return true;
}
window.init=init;window.renderAt=renderAt;
</script></body></html>
